name: Android CI

on:
  push:
    paths-ignore:
      - "backend/**"
  pull_request:
    paths-ignore:
      - "backend/**"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ktlint, assemble, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle wrapper, dependencies and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not committed; the placeholder has the same shape,
      # which is all the Google Services Gradle plugin needs to build. Unit tests never
      # talk to Firebase.
      - name: Use placeholder Firebase config
        run: cp app/google-services.json.example app/google-services.json

      - name: Lint, build and unit test
        run: ./gradlew ktlintCheck assembleDebug testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
